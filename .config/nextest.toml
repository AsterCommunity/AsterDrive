[profile.default]
fail-fast = false
retries = 0

[[profile.default.overrides]]
filter = 'package(=aster_drive) & binary(=operations) & test(/^cli::test_root_binary_database_migrate_(sqlite_to_postgres_happy_path|postgres_to_mysql_with_progress|mysql_to_sqlite_happy_path)$/)'
test-group = "database-migrations"

[test-groups.database-migrations]
max-threads = 1

[profile.ci]
inherits = "default"
status-level = "fail"
final-status-level = "slow"

[profile.database]
inherits = "ci"
# PostgreSQL integration tests share one testcontainer. GitHub-hosted Docker gives
# that container a small /dev/shm; higher fan-out can exhaust it during parallel queries.
test-threads = 4
slow-timeout = { period = "120s", terminate-after = 4 }

[profile.external]
inherits = "ci"
test-threads = 1
