<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>SFTP Server Icon</title>

  <!-- 方形深石板底（与应用图标一致） -->
  <rect width="512" height="512" rx="64" fill="#0F172A" />

  <!-- 服务器双杠 -->
  <rect x="126" y="166" width="260" height="72" rx="20"
        fill="none" stroke="#F8FAFC" stroke-width="26" />
  <rect x="126" y="274" width="260" height="72" rx="20"
        fill="none" stroke="#F8FAFC" stroke-width="26" />

  <!-- 状态灯 -->
  <circle cx="160" cy="202" r="11" fill="#3B82F6" />
  <circle cx="160" cy="310" r="11" fill="#3B82F6" />

  <!-- 双向传输箭头（下 / 上，蓝色 accent） -->
  <path d="M 336 184 L 336 218 M 324 206 L 336 218 L 348 206"
        fill="none" stroke="#3B82F6" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 336 328 L 336 294 M 324 306 L 336 294 L 348 306"
        fill="none" stroke="#3B82F6" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
