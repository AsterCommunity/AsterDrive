name: Setup Litmus
description: Install the pinned Litmus toolchain and configure Rust caching.

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.143

    - name: Install pinned Litmus and runtime dependencies
      shell: bash
      env:
        WEBDAV_COMPAT_TOOLS_DIR: ${{ runner.temp }}/webdav-compat-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf \
          automake \
          build-essential \
          ca-certificates \
          curl \
          ffmpeg \
          libexpat1-dev \
          libssl-dev \
          libvips-tools \
          perl \
          pkg-config
        scripts/ci/webdav-compat/install-litmus.sh

    - name: Record Litmus toolchain
      shell: bash
      env:
        WEBDAV_COMPAT_TOOLS_DIR: ${{ runner.temp }}/webdav-compat-tools
      run: |
        source scripts/ci/webdav-compat/versions.env
        mkdir -p artifacts/tool-versions
        {
          "${WEBDAV_COMPAT_TOOLS_DIR}/bin/litmus" --version
          echo "litmus_commit=${LITMUS_SOURCE_COMMIT}"
          echo "litmus_source_sha256=${LITMUS_SOURCE_SHA256}"
          echo "neon_commit=${LITMUS_NEON_COMMIT}"
          echo "neon_source_sha256=${LITMUS_NEON_SOURCE_SHA256}"
          openssl version
          rustc --version
          cargo --version
        } | tee artifacts/tool-versions/litmus.txt

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: webdav-litmus-0.18-v1
