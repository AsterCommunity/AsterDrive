name: CI Diagnostics

on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: Source workflow run ID to reconcile
        required: true
        type: string
  workflow_run:
    workflows:
      - Repository Automation
      - Rust CI
      - Frontend CI
      - E2E
      - Security Audit
      - Docs Check
      - Kubernetes Manifests
      - Multi-Primary E2E
      - WebDAV Compatibility
      - WebDAV Provider Range Baselines
    types: [completed]

concurrency:
  group: ci-diagnostics-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  summarize:
    name: Update PR gate and diagnostics
    runs-on: ubuntu-latest
    steps:
      # workflow_run always executes the trusted default-branch implementation.
      # CI logs and pull request metadata remain untrusted input to the script.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create AsterCommunity Automation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.ASTER_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ASTER_AUTOMATION_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Reconcile diagnostics
        uses: AsterCommunity/aster-automation@1168b6cbcdf5ab7e5360be9dc88b883c4cfa72f3 # v0.1.0 candidate
        with:
          mode: ci-diagnostics
          token: ${{ steps.app-token.outputs.token }}
          config-path: .github/aster-automation.json
