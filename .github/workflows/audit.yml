name: Security Audit

on:
  push:
    branches:
      - master
    paths:
      - '.nvmrc'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - '.nvmrc'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  schedule:
    # 每周一 09:17 UTC（北京时间 17:17）
    - cron: '17 9 * * 1'
  workflow_dispatch: # 支持手动触发

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-deny:
    name: Rust dependency check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0

      - name: Run cargo deny
        run: cargo deny check

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: frontend-panel
        run: bun install --frozen-lockfile

      - name: Run audit
        working-directory: frontend-panel
        run: bun run audit
