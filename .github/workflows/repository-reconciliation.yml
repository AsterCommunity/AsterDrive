name: Repository Reconciliation

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: repository-reconciliation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile repository governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create AsterCommunity Automation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.ASTER_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ASTER_AUTOMATION_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Reconcile open pull requests and CI incidents
        uses: AsterCommunity/aster-automation@1168b6cbcdf5ab7e5360be9dc88b883c4cfa72f3 # v0.1.0 candidate
        with:
          mode: reconcile-repository
          token: ${{ steps.app-token.outputs.token }}
          config-path: .github/aster-automation.json

      - name: Update release readiness dashboard
        uses: AsterCommunity/aster-automation@1168b6cbcdf5ab7e5360be9dc88b883c4cfa72f3 # v0.1.0 candidate
        with:
          mode: milestone-dashboard
          token: ${{ steps.app-token.outputs.token }}
          config-path: .github/aster-automation.json
