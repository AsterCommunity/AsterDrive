name: PR Automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Closed PR number whose pending gate should be finalized
        required: true
        type: string

concurrency:
  group: pr-automation-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  synchronize:
    name: Synchronize PR metadata
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs trusted default-branch code. Never change this
      # checkout to the untrusted pull request head.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Apply labels and linked-issue lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github/pr-automation.mjs
