name: Storage Provider Links

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  links:
    name: Official provider sources and freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check provider evidence and official links
        run: make storage-provider-links
      - name: Preserve reachability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-provider-links
          path: storage-provider-links.json
          if-no-files-found: warn
          retention-days: 30
