{{- define "asterdrive.pdb" -}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "asterdrive.workloadName" . }}
  labels:
    {{- include "asterdrive.labels" . | nindent 4 }}
spec:
  {{- if ne (toString .Values.podDisruptionBudget.maxUnavailable) "" }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ default "all" .Values.runtimeRole }}
      {{- include "asterdrive.selectorLabels" . | nindent 6 }}
{{- end }}

{{- end }}
{{- if .Values.split.enabled }}
{{- range $role := list "api" "worker" }}
{{- $ctx := deepCopy $ }}
{{- $_ := set $ctx.Values "runtimeRole" $role }}
{{- $_ := set $ctx.Values "podDisruptionBudget" (index $.Values.split $role).podDisruptionBudget }}
---
{{ include "asterdrive.pdb" $ctx }}
{{- end }}
{{- else }}
{{ include "asterdrive.pdb" . }}
{{- end }}
