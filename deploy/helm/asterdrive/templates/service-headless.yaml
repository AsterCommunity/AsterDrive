apiVersion: v1
kind: Service
metadata:
  name: {{ include "asterdrive.fullname" . }}-headless
  labels:
    {{- include "asterdrive.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "asterdrive.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      appProtocol: http
      port: 3000
      targetPort: http
      protocol: TCP
