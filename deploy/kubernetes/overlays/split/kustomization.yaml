apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: asterdrive
resources:
- ../../base
- worker.yaml
- worker-pdb.yaml
patches:
- target:
    kind: StatefulSet
    name: asterdrive
  patch: "- op: replace\n  path: /metadata/name\n  value: asterdrive-api\n- op: add\n\
    \  path: /spec/selector/matchLabels/app.kubernetes.io~1component\n  value: api\n\
    - op: add\n  path: /spec/template/metadata/labels/app.kubernetes.io~1component\n\
    \  value: api\n- op: add\n  path: /spec/template/spec/containers/0/args\n  value:\n\
    \  - serve\n  - api\n"
- target:
    kind: Service
    name: asterdrive
  patch: "- op: add\n  path: /spec/selector/app.kubernetes.io~1component\n  value:\
    \ api\n"
- target:
    kind: PodDisruptionBudget
    name: asterdrive
  patch: "- op: add\n  path: /spec/selector/matchLabels/app.kubernetes.io~1component\n\
    \  value: api\n"
