apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app.kubernetes.io/name: rustfs-local
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-local
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-alpha.90
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-local
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-local
                  key: secret-key
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
