apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: asterdrive
  labels:
    app.kubernetes.io/name: asterdrive
spec:
  serviceName: asterdrive-headless
  replicas: 2
  podManagementPolicy: Parallel
  minReadySeconds: 10
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: asterdrive
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asterdrive
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: asterdrive
      containers:
        - name: asterdrive
          image: ghcr.io/astercommunity/asterdrive:stable
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ASTER__DEPLOYMENT__INTERNAL_ENDPOINT
              value: http://$(POD_NAME).asterdrive-headless.$(POD_NAMESPACE).svc.cluster.local:3000
          envFrom:
            - configMapRef:
                name: asterdrive-cluster
            - secretRef:
                name: asterdrive-cluster
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: avatars
              mountPath: /data/avatar
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: avatars
          persistentVolumeClaim:
            claimName: asterdrive-avatars
        - name: tmp
          emptyDir: {}
