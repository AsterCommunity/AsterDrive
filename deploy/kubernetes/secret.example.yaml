apiVersion: v1
kind: Secret
metadata:
  name: asterdrive-cluster
  namespace: asterdrive
type: Opaque
stringData:
  ASTER__DATABASE__URL: postgres://USER:PASSWORD@POSTGRES_HOST:5432/asterdrive
  ASTER__CACHE__ENDPOINT: redis://:PASSWORD@REDIS_HOST:6379/0
  ASTER__CONFIG_SYNC__ENDPOINT: redis://:PASSWORD@REDIS_HOST:6379/0
  ASTER__DEPLOYMENT__INTERNAL_PROXY_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  ASTER__AUTH__JWT_SECRET: REPLACE_WITH_STABLE_RANDOM_JWT_SECRET
  ASTER__AUTH__SHARE_COOKIE_SECRET: REPLACE_WITH_STABLE_RANDOM_SHARE_COOKIE_SECRET
  ASTER__AUTH__DIRECT_LINK_SECRET: REPLACE_WITH_STABLE_RANDOM_DIRECT_LINK_SECRET
  ASTER__AUTH__MFA_SECRET_KEY: REPLACE_WITH_STABLE_RANDOM_MFA_SECRET
  ASTER__AUTH__STORAGE_CREDENTIAL_SECRET_KEY: REPLACE_WITH_STABLE_RANDOM_STORAGE_CREDENTIAL_SECRET
  ASTER__AUTH__WEBDAV_AUTH_CACHE_SECRET: REPLACE_WITH_STABLE_RANDOM_WEBDAV_AUTH_CACHE_SECRET
