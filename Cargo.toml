aster_forge_utils = { git = "https://github.com/AsterCommunity/AsterForge", package = "aster_forge_utils" }
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
hex = "0.4"
