# WOPI proof and OIDC mock tests use rsa directly. crypto-glue (via
# webauthn-authenticator-rs) still requires the rc line with its `sha2` feature,
# which rsa 0.10.0 stable removed; relax this once crypto-glue drops it.
rsa = "^0.10.0-rc.18"
russh = { version = "0.65.4", default-features = false }
russh-sftp = "3.0.1"
rust-embed = "8"
rustix = "1"
