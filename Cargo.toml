[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[package]
name = "aster_drive"
version.workspace = true
description = "A self-hosted cloud storage solution."
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# 开发构建优先缩短「改代码 -> 编译/测试」的反馈时间。
# 工作区代码保持 O0 以避免每次修改后重做优化；第三方依赖单独使用 O1，
# 避免 crypto/image/compression 等依赖在 debug/test 运行时过慢。
[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
debug = 1
panic = "unwind"
strip = false
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
# Keep function symbols for actionable production panic backtraces while
# leaving source-level debug information out of the distributed binary.
debug = 0
# Keep ordinary request/task panics from taking down every HTTP worker. Stack overflow and OOM
# remain process-fatal and must be prevented at their input/allocation boundaries.
panic = "unwind"
strip = "debuginfo"

# 压测/火焰图采样用：接近 release，但保留符号并关闭 LTO，方便 perf 展开栈。
# frame pointer 需要通过 RUSTFLAGS 传入：
# RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling
[profile.profiling]
inherits = "release"
opt-level = 2
codegen-units = 1
debug = true
strip = false
lto = false
panic = "unwind"

[profile.release-performance]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

