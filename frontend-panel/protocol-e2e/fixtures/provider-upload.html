<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Provider upload protocol fixture</title></head>
  <body>
    <script type="module">
      import { createUploadService } from "/src/services/uploadService.ts";

      const service = createUploadService({ kind: "personal" });
      window.uploadFragment = async (url, start, total, content) => {
        try {
          const offset = await service.providerResumableUpload(url, new Blob([content]), start, total, {
            onCreateXhr: (xhr) => { window.activeUpload = xhr; },
          });
          return { offset };
        } catch (error) {
          return { error: error.message, retryable: error.retryable, aborted: error.isAborted, status: error.status };
        }
      };
    </script>
  </body>
</html>
