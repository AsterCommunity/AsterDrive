[package]
name = "aster_drive_metrics"
version.workspace = true
description = "AsterDrive product metrics contracts and AsterForge adapters."
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
metrics = [
    "dep:tracing",
    "aster_forge_metrics/allocator-metrics",
    "aster_forge_metrics/backend-prometheus",
    "aster_forge_metrics/runtime-health",
]

[dependencies]
aster_forge_metrics = { workspace = true }
aster_forge_runtime = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
